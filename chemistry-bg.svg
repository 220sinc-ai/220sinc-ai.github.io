<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="fogA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a6d968" stop-opacity=".62"/>
      <stop offset=".42" stop-color="#548c39" stop-opacity=".34"/>
      <stop offset="1" stop-color="#0b170a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fogB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7ba54f" stop-opacity=".56"/>
      <stop offset=".46" stop-color="#355f2b" stop-opacity=".3"/>
      <stop offset="1" stop-color="#091307" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fogC" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#cadf88" stop-opacity=".38"/>
      <stop offset=".5" stop-color="#5d8438" stop-opacity=".2"/>
      <stop offset="1" stop-color="#091307" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="murk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d160b"/>
      <stop offset=".55" stop-color="#060c06"/>
      <stop offset="1" stop-color="#020402"/>
    </linearGradient>

    <!-- Крупные завихрения тумана: фильтр статичен, движение даёт CSS-анимация слоя -->
    <filter id="swirl" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.006" numOctaves="2" seed="4" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="70" xChannelSelector="R" yChannelSelector="G" result="disp"/>
      <feGaussianBlur in="disp" stdDeviation="10"/>
    </filter>

    <!-- Мелкое клубящееся облако шума -->
    <filter id="billow" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.010 0.014" numOctaves="2" seed="13" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.34  0 0 0 0 0.60  0 0 0 0 0.20  1.7 0 0 0 -0.55" result="cloud"/>
      <feGaussianBlur in="cloud" stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#murk)"/>

  <g filter="url(#swirl)">
    <ellipse cx="250" cy="260" rx="640" ry="430" fill="url(#fogA)"/>
    <ellipse cx="1320" cy="320" rx="660" ry="410" fill="url(#fogB)"/>
    <ellipse cx="760" cy="800" rx="790" ry="430" fill="url(#fogC)"/>
    <ellipse cx="1450" cy="880" rx="540" ry="370" fill="url(#fogA)"/>
    <ellipse cx="110" cy="880" rx="500" ry="350" fill="url(#fogB)"/>
    <ellipse cx="820" cy="120" rx="560" ry="300" fill="url(#fogB)"/>
  </g>

  <rect width="1600" height="1000" filter="url(#billow)" opacity=".55"/>
</svg>
